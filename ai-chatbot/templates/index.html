<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sqrock Assistant — AI Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<div class="app">
  <header class="chat-header">
    <div class="brand"><span class="dot"></span> Sqrock Assistant</div>
    <div class="header-right">
      <span class="mode mode--{{ mode }}">{{ 'Live AI' if mode == 'live' else 'Offline demo' }}</span>
      <button id="themeToggle" class="theme-btn" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main id="messages" class="messages">
    <div class="msg msg--bot">
      <div class="avatar">🤖</div>
      <div class="bubble">Hi! I'm <strong>Sqrock Assistant</strong>. Ask me anything, or try “tell me a joke”, “what time is it?”, or “what is Flask?”.</div>
    </div>
  </main>

  <form id="chatForm" class="composer">
    <input id="input" autocomplete="off" placeholder="Type your message…" />
    <button type="submit" aria-label="Send">➤</button>
  </form>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
